name: General V Daily Briefing

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip social posting)"
        required: false
        default: "false"

jobs:
  post-goon-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Sync Goon images from Dropbox
        env:
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          DROPBOX_GOONS_PATH: "/Vault/GoonGalaxy/GoonGalaxyGenerator/create-10k-nft-collection-2.0.0/build/images"
          DROPBOX_JSON_PATH: "/Vault/GoonGalaxy/GoonGalaxyGenerator/create-10k-nft-collection-2.0.0/build/json"
        run: python scripts/sync_goon_images.py

      - name: Run General V pipeline
        env:
          OBSIDIAN_GOONS_PATH: "./goons"
          IMAGINE_API_KEY: ${{ secrets.IMAGINE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          CLOUDINARY_UPLOAD_PRESET_URL: ${{ secrets.CLOUDINARY_UPLOAD_PRESET_URL }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
          DROPBOX_GOONS_PATH: "/Vault/GoonGalaxy/GoonGalaxyGenerator/create-10k-nft-collection-2.0.0/build/images"
          DROPBOX_JSON_PATH: "/Vault/GoonGalaxy/GoonGalaxyGenerator/create-10k-nft-collection-2.0.0/build/json"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          echo "Testing imports..."
          python -c "import os; print('os ok')"
          python -c "import anthropic; print('anthropic ok')"
          python -c "from goon_namer import generate_goon_name; print('goon_namer ok')"
          python -c "from imagine_render import render_goon_image; print('imagine_render ok')"
          python -c "from script_generator import generate_briefing_script; print('script_generator ok')"
          python -c "from voice_generator import generate_narration; print('voice_generator ok')"
          python -c "from video_generator import generate_runway_video; print('video_generator ok')"
          python -c "from video_assembler import assemble_final_video; print('video_assembler ok')"
          python -c "from social_poster import post_to_instagram; print('social_poster ok')"
          python -c "from goon_log import get_next_goon; print('goon_log ok')"
          echo "All imports done, running pipeline..."
          python pipeline.py
        

      - name: Upload output artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goon-output-${{ github.run_number }}
          path: output/
          retention-days: 7
